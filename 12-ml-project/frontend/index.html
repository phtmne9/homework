<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предсказание цены жилья</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Предсказание цены жилья</h1>
      <p class="lead">
        Нейронная сеть на PyTorch оценивает медианную стоимость дома в районе
        Калифорнии по восьми характеристикам. Датасет California Housing,
        20&nbsp;640 записей.
      </p>
      <p class="quality" id="quality">Загрузка информации о модели…</p>
    </header>

    <form class="card" id="form" novalidate>
      <div class="grid">
        <label>
          <span>Средний доход <small>десятки тысяч $</small></span>
          <input name="MedInc" type="number" step="0.01" value="8.3" required>
        </label>
        <label>
          <span>Возраст домов <small>лет</small></span>
          <input name="HouseAge" type="number" step="1" value="41" required>
        </label>
        <label>
          <span>Среднее число комнат</span>
          <input name="AveRooms" type="number" step="0.01" value="6.98" required>
        </label>
        <label>
          <span>Среднее число спален</span>
          <input name="AveBedrms" type="number" step="0.01" value="1.02" required>
        </label>
        <label>
          <span>Население района</span>
          <input name="Population" type="number" step="1" value="322" required>
        </label>
        <label>
          <span>Жильцов на дом</span>
          <input name="AveOccup" type="number" step="0.01" value="2.55" required>
        </label>
        <label>
          <span>Широта</span>
          <input name="Latitude" type="number" step="0.01" value="37.88" required>
        </label>
        <label>
          <span>Долгота</span>
          <input name="Longitude" type="number" step="0.01" value="-122.23" required>
        </label>
      </div>

      <button type="submit" id="submit">Предсказать</button>
    </form>

    <section class="result" id="result" hidden>
      <div class="price" id="price"></div>
      <div class="meta" id="meta"></div>
    </section>

    <section class="error" id="error" hidden></section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
